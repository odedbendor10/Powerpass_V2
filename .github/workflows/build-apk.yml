# בניית קובץ APK חתום של POWERPASS בענן (בלי סביבת פיתוח במחשב).
# הפעלה: לשונית Actions ← "Build Android APK" ← Run workflow.
# הקובץ המוכן מופיע בתחתית עמוד ההרצה, תחת Artifacts.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'סוג הבנייה (release = חתום להפצה; debug = לבדיקה מהירה, בלי Keystore)'
        type: choice
        options: [release, debug]
        default: release
      store_mode:
        description: 'מצב חנות (Reader App): להסתיר קישורי רכישה ומחירים באפליקציה'
        type: boolean
        default: false
      api_base:
        description: 'כתובת API אחרת לבדיקה (ריק = www.powerpass.co.il)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      STORE_MODE: ${{ github.event.inputs.store_mode || 'false' }}
      API_BASE: ${{ github.event.inputs.api_base || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK licenses
        # ubuntu-latest כבר כולל Android SDK מותקן.
        # android-actions/setup-android@v3 נכשל על SDK חדש (חבילת 'tools' הוסרה).
        # נאשר רישיונות ונוסיף build-tools + platform ישירות דרך sdkmanager.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" --channel=0

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install (npm)
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Configure app (version / store mode / API)
        run: node scripts/configure.mjs

      - name: Create Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME=$(node -p "require('./package.json').version")
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          chmod +x android/gradlew

      - name: Keystore
        if: env.BUILD_TYPE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_BASE64. ראו README.md, שלב 2 (יצירת Keystore והוספת הסודות). לבדיקה מהירה אפשר להריץ עם build_type=debug."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (signed)
        if: env.BUILD_TYPE == 'release'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS_PASS KEY_ALIAS KEY_PASS; do if [ -z "${!v}" ]; then echo "::error::חסר אחד מהסודות ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"; exit 1; fi; done
          cd android
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify & rename
        run: |
          VER=$(node -p "require('./package.json').version")
          SRC=$(ls android/app/build/outputs/apk/$BUILD_TYPE/*.apk | head -1)
          SUFFIX=""; [ "$BUILD_TYPE" = "debug" ] && SUFFIX="-debug"; [ "$STORE_MODE" = "true" ] && SUFFIX="$SUFFIX-store"
          OUT="POWERPASS-v${VER}-${{ github.run_number }}${SUFFIX}.apk"
          mkdir -p dist && cp "$SRC" "dist/$OUT"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "dist/$OUT" | tee dist/signature.txt
          echo "APK_FILE=$OUT" >> $GITHUB_ENV
          echo "### ✅ POWERPASS $OUT" >> $GITHUB_STEP_SUMMARY
          echo "הקובץ נמצא למטה תחת **Artifacts** (POWERPASS-apk)." >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POWERPASS-apk
          path: dist/*.apk
          retention-days: 30

      - name: GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
