# יצירת Keystore חד-פעמית בענן (למי שאין Java במחשב).
# לפני ההרצה: הוסיפו את הסודות ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (ראו README.md).
# אחרי ההרצה: הורידו את ה-Artifact, העתיקו את התוכן של keystore-base64.txt לסוד ANDROID_KEYSTORE_BASE64,
# שמרו את powerpass-release.jks בגיבוי בטוח (לתמיד!), ומחקו את ה-Artifact מעמוד ההרצה.
name: Create signing keystore (one-time)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'הקלידו YES כדי ליצור מפתח חתימה חדש (רק פעם אחת בחיי האפליקציה!)'
        required: true
        default: ''

jobs:
  keystore:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS_PASS KEY_ALIAS KEY_PASS; do if [ -z "${!v}" ]; then echo "::error::חסר אחד מהסודות ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"; exit 1; fi; done
          mkdir out
          keytool -genkeypair -v -keystore out/powerpass-release.jks -storetype JKS \
            -storepass "$KS_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -dname "CN=POWERPASS, O=Oded Electric, L=Rishon LeZion, C=IL"
          base64 -w0 out/powerpass-release.jks > out/keystore-base64.txt
          keytool -list -v -keystore out/powerpass-release.jks -storepass "$KS_PASS" | grep -E "SHA256|Valid" > out/fingerprint.txt
          cat out/fingerprint.txt
      - uses: actions/upload-artifact@v4
        with:
          name: powerpass-keystore-DELETE-AFTER-DOWNLOAD
          path: out/
          retention-days: 1
